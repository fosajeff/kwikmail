services:
  postgres:
    image: postgres:16
    container_name: kwikmail-postgres
    environment:
      POSTGRES_USER: kwikmail
      POSTGRES_PASSWORD: kwikmail
      POSTGRES_DB: kwikmail
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: kwikmail-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: 